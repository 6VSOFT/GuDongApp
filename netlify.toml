[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_DEPLOY_TARGET = "netlify"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/game"
  to = "/.netlify/functions/game"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, private"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
